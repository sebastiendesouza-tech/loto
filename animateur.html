<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animateur</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="stylesheet" href="css/app.css?v=5-animateur-confirmation-3"><link rel="stylesheet" href="css/sync.css?v=20261107-player-counter"><link rel="stylesheet" href="css/animateur-controls.css?v=20261108-listening-clean"></head><body data-player-presence="observer" class="animateur-body">
<header class="topbar"><div class="brand-with-connection"><span class="brand" data-title></span><button type="button" class="spectator-connection" data-connection-info aria-label="Non connecté. Vérifiez votre connexion Internet." title="Non connecté. Vérifiez votre connexion Internet." aria-describedby="animateurConnectionTooltip" aria-expanded="false"><span class="connection-light" data-sync-status data-sync-light data-state="waiting" data-connected="false" aria-hidden="true"></span><span id="animateurConnectionTooltip" class="connection-tooltip" data-connection-tooltip role="tooltip">Non connecté. Vérifiez votre connexion Internet.</span></button><span class="player-presence-count" data-player-presence-status role="status" aria-live="polite" aria-label="Connexion du compteur en cours" title="Connexion du compteur en cours"><svg viewBox="0 0 18 26" width="14" height="20" aria-hidden="true" focusable="false"><rect x="2" y="1" width="14" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 4h4M8 22h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span data-player-count>—</span></span></div><div class="session"><span data-loto-name>Loto by SdS</span> · Animateur</div></header>
<main class="wrap animateur-wrap-v229">
  <div class="animateur-main-v229">
    <section class="card numbers-card animateur-grid-panel">
      <div id="grid" class="numbers animateur-numbers"></div>
    </section>
    <aside class="animateur-side-v229">
      <div class="animateur-sidebar-content">
      <div class="card one-line animateur-commandbar">
    <div class="animateur-command-tiles">
    <button id="launchLoto" class="green" disabled>Lancer loto</button>
    <button id="newGame" class="secondary" disabled>Partie simple</button>
    <a id="animateurMenuLink" class="btn light" href="index.html" target="_blank" rel="noopener noreferrer">Menu</a>
    <button id="openCardControl" class="light" type="button" aria-haspopup="dialog">Contrôle carton</button>
    </div>
    <div class="animateur-voice-controls"><select id="voiceMode" aria-label="Mot-clé de reconnaissance"><option value="le" selected>Le</option><option value="numero">Numéro</option></select><button id="miniBingoWon" class="secondary" style="display:none">Mini-bingo gagné</button><button id="startMiniBingo" class="green" style="display:none">Lancer Mini-bingo</button></div>
    
  </div>
      <div class="card animateur-last-card animateur-last-progress">
        <div class="animateur-last-info"><div class="side-label">Dernier numéro</div><div id="last" class="animateur-last-number">--</div></div>
        <button id="winner" class="animateur-progress-button" type="button" disabled>Lot suivant</button>
      </div>
      <section id="animateurLotPanel" class="card animateur-lot-card" aria-label="Partie et lots">
        <div id="animateurPartTitle" class="commissaire-lot-title">Partie simple</div>
        <div id="currentLot" class="animateur-lot-content"></div>
      </section>

      </div>
      <section class="card animateur-listening-panel" aria-label="Choisir ce que le PC écoute">
        <div class="animateur-listening-buttons" role="group" aria-label="Mode d’écoute">
          <button id="voiceListenDraw" type="button" aria-pressed="false" disabled>Tirage</button>
          <button id="voiceListenCard" type="button" aria-pressed="false" disabled>Contrôle</button>
          <button id="voiceListenOff" type="button" aria-pressed="false" disabled>Libre</button>
        </div>
      </section>
    </aside>
  </div>
  <div class="card history-card"><h3>Historique</h3><div id="history" class="history"></div></div>
</main>
<div id="animateurCardDialog" class="modal-soft animateur-card-dialog" role="dialog" aria-modal="true" aria-labelledby="animateurCardDialogTitle" hidden>
  <div class="modal-panel"><div class="animateur-card-dialog-heading"><h2 id="animateurCardDialogTitle">Contrôle carton</h2><button id="closeCardControl" type="button" class="secondary" aria-label="Fermer la fenêtre de contrôle">Fermer la fenêtre</button></div>
      <div class="card animateur-control-card" role="group" aria-label="Contrôle carton">
        <div class="toolbar control-toolbar-v229">
          <div class="carton-number-field"><span id="animateurCardPrefix" class="carton-number-prefix" aria-hidden="true">101</span><input id="animCardNumber" type="text" inputmode="numeric" autocomplete="off" minlength="3" maxlength="3" pattern="[0-9]{3}" placeholder="000" aria-label="Trois derniers chiffres du carton, série 101"></div>
          <button id="animCheckBtn">Contrôler</button>
          <button id="animHidePublic" class="secondary">Fermer</button>
        </div>
        <div id="animCardResult" class="result-box compact-result"></div>
      </div>
</div></div>
<div id="voicePauseBanner" class="voice-pause-banner" role="status" style="display:none"></div>
<div id="launchModal" class="modal-soft" style="display:none"><div class="modal-panel"><h2>Lancer un loto</h2><p>Choisis un loto enregistré ou démarre une partie simple.</p><div id="launchGuard" class="notice" style="display:none"></div><div id="launchList"></div><p class="toolbar"><button id="closeLaunch" class="secondary">Fermer</button><button id="modalBlankGame">Nouvelle partie simple</button></p></div></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/core.js?v=20261107-audit-fixes"></script><script src="js/pc-microphone.js?v=20261108-mic-status"></script><script src="js/card-number-input.js?v=20261107-card-series"></script><script src="js/mystery-board.js?v=20261107-super-quine"></script><script src="js/animateur-page.js?v=20261108-listening-no-text"></script><script src="js/player-presence.js?v=20261107-player-counter"></script></body></html>
