<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animateur</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><link rel="stylesheet" href="css/app.css?v=5-animateur-confirmation-3"><link rel="stylesheet" href="css/sync.css?v=20261107-close-public-card"><link rel="stylesheet" href="css/animateur-controls.css?v=20261107-compact-controls"></head><body class="animateur-body">
<header class="topbar"><div class="brand-with-connection"><span class="brand" data-title></span><button type="button" class="spectator-connection" data-connection-info aria-label="Non connecté. Vérifiez votre connexion Internet." title="Non connecté. Vérifiez votre connexion Internet." aria-describedby="animateurConnectionTooltip" aria-expanded="false"><span class="connection-light" data-sync-status data-sync-light data-state="waiting" data-connected="false" aria-hidden="true"></span><span id="animateurConnectionTooltip" class="connection-tooltip" data-connection-tooltip role="tooltip">Non connecté. Vérifiez votre connexion Internet.</span></button></div><div class="session"><span data-loto-name>Loto by SdS</span> · Animateur</div></header>
<main class="wrap animateur-wrap-v229">
  <div class="animateur-main-v229">
    <section class="card numbers-card animateur-grid-panel">
      <div id="grid" class="numbers animateur-numbers"></div>
    </section>
    <aside class="animateur-side-v229">
      <div class="animateur-sidebar-content">
      <div class="card one-line animateur-commandbar">
    <div class="animateur-command-tiles">
    <button id="launchLoto" class="green" disabled>Lancer loto</button>
    <button id="newGame" class="secondary" disabled>Partie simple</button>
    <a id="animateurMenuLink" class="btn light" href="index.html" target="_blank" rel="noopener noreferrer">Menu</a>
    </div>
    <div class="animateur-voice-controls"><select id="voiceControlMode" aria-label="Mode de tirage"><option value="micro" selected>Vocal</option><option value="manual">Manuel</option></select><select id="voiceMode" aria-label="Mot-clé de reconnaissance"><option value="le" selected>Le</option><option value="numero">Numéro</option></select><button id="miniBingoWon" class="secondary" style="display:none">Mini-bingo gagné</button><button id="startMiniBingo" class="green" style="display:none">Lancer Mini-bingo</button></div>
    
  </div>
      <div class="card animateur-last-card animateur-last-progress">
        <div class="animateur-last-info"><div class="side-label">Dernier numéro</div><div id="last" class="animateur-last-number">--</div></div>
        <button id="winner" class="animateur-progress-button" type="button" disabled>Lot suivant</button>
      </div>
      <section id="animateurLotPanel" class="card animateur-lot-card" aria-label="Partie et lots">
        <div id="animateurPartTitle" class="commissaire-lot-title">Partie simple</div>
        <div id="currentLot" class="animateur-lot-content"></div>
      </section>

      <div class="card animateur-control-card" role="group" aria-label="Contrôle carton">
        <div class="toolbar control-toolbar-v229">
          <div class="carton-number-field"><span id="animateurCardPrefix" class="carton-number-prefix" aria-hidden="true">101</span><input id="animCardNumber" type="text" inputmode="numeric" autocomplete="off" minlength="3" maxlength="3" pattern="[0-9]{3}" placeholder="000" aria-label="Trois derniers chiffres du carton, série 101"></div>
          <button id="animCheckBtn">Contrôler</button>
          <button id="animHidePublic" class="secondary">Fermer</button>
        </div>
        <div id="animCardResult" class="result-box compact-result"></div>
      </div>
      </div>
      <button id="toggleVoiceListening" class="red voice-listening-button animateur-micro-dock" type="button" aria-pressed="false" disabled>Mettre l’écoute en pause</button>
    </aside>
  </div>
  <div class="card history-card"><h3>Historique</h3><div id="history" class="history"></div></div>
</main>
<div id="voicePauseBanner" class="voice-pause-banner" role="status" style="display:none"></div>
<div id="launchModal" class="modal-soft" style="display:none"><div class="modal-panel"><h2>Lancer un loto</h2><p>Choisis un loto enregistré ou démarre une partie simple.</p><div id="launchGuard" class="notice" style="display:none"></div><div id="launchList"></div><p class="toolbar"><button id="closeLaunch" class="secondary">Fermer</button><button id="modalBlankGame">Nouvelle partie simple</button></p></div></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/core.js?v=20261107-concise-card-mode"></script><script src="js/pc-microphone.js"></script><script src="js/card-number-input.js?v=20261107-card-series"></script><script src="js/animateur-page.js?v=20261107-concise-card-mode"></script></body></html>
