<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Affichage public</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/public-display.css">
<link rel="stylesheet" href="css/sync.css?v=20261107-player-counter"></head>
<body class="public-body public-v213 public-projection">
  <header class="public-topbar">
    <div class="public-brand"><span data-title></span></div>
    <div class="public-heading">
      <div class="public-loto-name" data-loto-name>Loto by SdS</div>
      <div id="publicPartHeader" class="public-part-header">Partie --/--</div>
    </div>
    <button id="micBtn" class="public-mic green" type="button" aria-pressed="false">Micro PC</button>
  </header>

  <main class="public-layout-v213">
    <section class="public-main-v213">
      <div class="public-grid-v213"><div id="grid" class="numbers"></div></div>
    </section>

    <aside class="public-side-v213">
      <section class="public-last-card" aria-label="Dernier numéro annoncé">
        <div class="public-last-label">Dernier numéro</div>
        <div id="last" class="public-number-v213" aria-live="polite">--</div>
      </section>
      <div class="public-info-card">
        <div id="publicGameTitle" class="public-game-title">Partie n°--</div>
        <div id="publicGameMode" class="public-game-mode">Jeu : --</div>
        <div id="publicStep" class="public-step">--</div>
        <div id="publicLot" class="public-lot">LOT : --</div>
      </div>

      <div class="sync-controls public-backup-controls"><span class="connection-light" data-sync-status data-sync-light data-state="waiting" role="img" aria-label="Connexion en cours" title="Connexion en cours"></span><div class="public-backup-buttons"><button type="button" id="publicControlCard" hidden>Contrôler</button><button type="button" id="publicNextPartie" hidden disabled>Lot suivant</button></div></div>
      <div class="public-bingo-card" id="bingoBox" style="display:none"></div>
    </aside>
  </main>

  <div id="cardOverlay" style="display:none;position:fixed;inset:5%;z-index:50;background:#fff;color:#111;border-radius:22px;padding:24px;box-shadow:0 0 0 999px rgba(0,0,0,.65)"></div>

  <div id="publicControlDialog" class="modal-soft public-control-dialog" role="dialog" aria-modal="true" aria-labelledby="publicControlTitle" hidden>
    <form id="publicControlForm" class="modal-panel">
      <h2 id="publicControlTitle">Contrôler un carton</h2>
      <label for="publicCardSuffix">Les 3 derniers chiffres du carton</label>
      <div class="carton-number-field"><span id="publicCardPrefix" class="carton-number-prefix" aria-hidden="true">101</span><input id="publicCardSuffix" type="text" inputmode="numeric" autocomplete="off" minlength="3" maxlength="3" pattern="[0-9]{3}" placeholder="000" aria-label="Trois derniers chiffres du carton, série 101" required></div>
      <p id="publicControlMessage" class="public-control-message" role="status" hidden></p>
      <div class="toolbar"><button id="publicControlSubmit" type="submit">Contrôler et afficher</button><button id="publicControlCancel" type="button" class="secondary">Annuler</button></div>
    </form>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/core.js?v=20261107-audit-fixes"></script>
  <script src="js/voice.js?v=20261108-listening"></script>
  <script src="js/pc-microphone.js?v=20261108-listening"></script>
  <script src="js/card-number-input.js?v=20261107-card-series"></script>
  <script src="js/offline-card-control.js?v=20261107-offline-control"></script>
  <script src="js/mystery-board.js?v=20261107-super-quine"></script><script src="js/public-page.js?v=20261108-listening"></script>
</body>
</html>
