<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Affichage public</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/public-display.css">
<link rel="stylesheet" href="css/sync.css?v=20261106-launch-guard"></head>
<body class="public-body public-v213 public-projection">
  <header class="public-topbar">
    <div class="public-brand"><span data-title></span></div>
    <div class="public-heading">
      <div class="public-loto-name" data-loto-name>Loto by SdS</div>
      <div id="publicPartHeader" class="public-part-header">Partie --/--</div>
    </div>
    <button id="micBtn" class="public-mic green" type="button" aria-pressed="false">Micro PC</button>
  </header>

  <main class="public-layout-v213">
    <section class="public-main-v213">
      <div class="public-grid-v213"><div id="grid" class="numbers"></div></div>
    </section>

    <aside class="public-side-v213">
      <section class="public-last-card" aria-label="Dernier numéro annoncé">
        <div class="public-last-label">Dernier numéro</div>
        <div id="last" class="public-number-v213" aria-live="polite">--</div>
      </section>
      <div class="public-info-card">
        <div id="publicGameTitle" class="public-game-title">Partie n°--</div>
        <div id="publicGameMode" class="public-game-mode">Jeu : --</div>
        <div id="publicStep" class="public-step">--</div>
        <div id="publicLot" class="public-lot">LOT : --</div>
      </div>

      <div class="sync-controls public-backup-controls"><span class="connection-light" data-sync-status data-sync-light data-state="waiting" role="img" aria-label="Connexion en cours" title="Connexion en cours"></span><div class="public-backup-buttons"><button type="button" id="publicNextPartie" disabled>Partie suivante</button></div></div>
      <div class="public-bingo-card" id="bingoBox" style="display:none"></div>
    </aside>
  </main>

  <div id="cardOverlay" style="display:none;position:fixed;inset:5%;z-index:50;background:#fff;color:#111;border-radius:22px;padding:24px;box-shadow:0 0 0 999px rgba(0,0,0,.65)"></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/core.js?v=20261106-spectator-light"></script>
  <script src="js/voice.js?v=20261106-complete-announcements"></script>
  <script src="js/pc-microphone.js"></script>
  <script src="js/public-page.js?v=20261106-auto-only"></script>
</body>
</html>
